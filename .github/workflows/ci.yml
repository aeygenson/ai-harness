# Builds and tests the harness on Linux, macOS and Windows for every pull
# request and every push to main, so a change that breaks one system shows
# up at once.
name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      # Finish all three systems even when one fails: we want the whole picture.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # The tests make real git commits in temporary repositories.
      - name: Set a git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Install script for macOS and Linux
        if: matrix.os != 'windows-latest'
        run: bash -n install/install.sh
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --no-fail-fast

  # The Windows install script must at least be valid PowerShell.
  install-script:
    name: install.ps1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path install/install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Host $_ }; exit 1 }
