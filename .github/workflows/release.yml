# Builds the ready-to-run `harness` program for Windows, macOS (Apple silicon
# and Intel) and Linux (x86_64 and ARM) and
# puts it on the Releases page. The install scripts (install/) download it
# from there, so nobody has to install Rust to use the harness.
#
# Start it from the Actions tab («Run workflow», give a version like 0.1.0)
# or by pushing a tag `v0.1.0`. The files always have the same names, so
#   https://github.com/aeygenson/ai-harness/releases/latest/download/<file>
# is always the newest one.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, for example 0.1.0 (the tag becomes v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: harness-x86_64-pc-windows-msvc.zip
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: harness-aarch64-apple-darwin.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: harness-x86_64-apple-darwin.tar.gz
          # musl: one program that runs on every Linux, old or new.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: harness-x86_64-unknown-linux-musl.tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            archive: harness-aarch64-unknown-linux-musl.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        run: |
          # On Windows the C runtime goes into harness.exe, so it runs on a
          # fresh Windows without the Visual C++ Redistributable.
          if [ "${{ runner.os }}" = "Windows" ]; then
            export RUSTFLAGS="-C target-feature=+crt-static"
          fi
          cargo build --release --locked -p harness-cli --target ${{ matrix.target }}
      - name: Pack
        shell: bash
        run: |
          mkdir pack
          cp assets/icons/ai-harness.ico assets/icons/ai-harness-256.png pack/
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/harness.exe pack/
            cd pack && 7z a ../${{ matrix.archive }} * >/dev/null
          else
            cp target/${{ matrix.target }}/release/harness pack/
            tar -czf ${{ matrix.archive }} -C pack .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            tag="v${{ inputs.version }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          (cd dist && sha256sum * > SHA256SUMS.txt)
          gh release create "$tag" dist/* \
            --target "$GITHUB_SHA" \
            --title "harness $tag" \
            --notes "Windows (PowerShell): irm https://raw.githubusercontent.com/${GH_REPO}/main/install/install.ps1 | iex
          macOS and Linux (Terminal): curl -fsSL https://raw.githubusercontent.com/${GH_REPO}/main/install/install.sh | bash"

  # The install script itself, on a real Windows, against the release just
  # published (only the harness part: winget's packages are too slow here).
  check:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install with the script
        shell: powershell
        run: |
          $env:HARNESS_ONLY = "harness"
          Get-Content install/install.ps1 -Raw | Invoke-Expression
          $exe = Join-Path $env:LOCALAPPDATA "Programs\harness\harness.exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "harness.exe does not run" }
          $link = Join-Path ([Environment]::GetFolderPath("Desktop")) "AI Harness.lnk"
          if (-not (Test-Path $link)) { throw "no desktop shortcut" }

  check-unix:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install with the script
        run: |
          HARNESS_ONLY=harness bash install/install.sh
          "$HOME/.local/bin/harness" --version
