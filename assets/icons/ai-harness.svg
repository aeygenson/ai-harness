<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>AI Harness</title>
  <!-- A conductor (the H core) holding four agents on its strings:
       Architect (blue), Developer (green), Tester (amber), Security (pink).
       The small white dot on the orbit is Retro. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1f5c"/>
      <stop offset="0.55" stop-color="#151236"/>
      <stop offset="1" stop-color="#0a0c1f"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b6cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b6cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c7b8ff"/>
      <stop offset="0.5" stop-color="#8b6cff"/>
      <stop offset="1" stop-color="#5a3fe0"/>
    </linearGradient>
    <linearGradient id="gA" x1="128" y1="128" x2="62" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b9a8ff"/><stop offset="1" stop-color="#4da3ff"/>
    </linearGradient>
    <linearGradient id="gD" x1="128" y1="128" x2="194" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b9a8ff"/><stop offset="1" stop-color="#3ddc97"/>
    </linearGradient>
    <linearGradient id="gT" x1="128" y1="128" x2="194" y2="194" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b9a8ff"/><stop offset="1" stop-color="#ffb547"/>
    </linearGradient>
    <linearGradient id="gS" x1="128" y1="128" x2="62" y2="194" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b9a8ff"/><stop offset="1" stop-color="#ff5c8a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tile"><rect x="8" y="8" width="240" height="240" rx="56"/></clipPath>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <g clip-path="url(#tile)" opacity="0.18" fill="#b9a8ff">
    <circle cx="40" cy="128" r="1.6"/><circle cx="216" cy="128" r="1.6"/>
    <circle cx="128" cy="40" r="1.6"/><circle cx="128" cy="216" r="1.6"/>
    <circle cx="84" cy="30" r="1.2"/><circle cx="172" cy="226" r="1.2"/>
    <circle cx="30" cy="172" r="1.2"/><circle cx="226" cy="84" r="1.2"/>
  </g>
  <circle cx="128" cy="128" r="96" fill="url(#halo)"/>

  <!-- orbit -->
  <circle cx="128" cy="128" r="88" fill="none" stroke="#b9a8ff" stroke-opacity="0.28"
          stroke-width="2" stroke-dasharray="3 7" stroke-linecap="round"/>

  <!-- strings from the conductor to each agent -->
  <g fill="none" stroke-width="5" stroke-linecap="round" filter="url(#glow)">
    <path d="M128 128 Q 82 112 66 66" stroke="url(#gA)"/>
    <path d="M128 128 Q 144 82 190 66" stroke="url(#gD)"/>
    <path d="M128 128 Q 174 144 190 190" stroke="url(#gT)"/>
    <path d="M128 128 Q 112 174 66 190" stroke="url(#gS)"/>
  </g>

  <!-- agents -->
  <g filter="url(#glow)">
    <circle cx="66" cy="66" r="24" fill="#4da3ff"/>
    <circle cx="190" cy="66" r="24" fill="#3ddc97"/>
    <circle cx="190" cy="190" r="24" fill="#ffb547"/>
    <circle cx="66" cy="190" r="24" fill="#ff5c8a"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Architect: compass -->
    <path d="M66 52 L56 78 M66 52 L76 78 M59 70 L73 70"/>
    <circle cx="66" cy="52" r="2.5" fill="#ffffff" stroke="none"/>
    <!-- Developer: </> -->
    <path d="M181 57 L173 66 L181 75 M199 57 L207 66 L199 75 M193 55 L187 77"/>
    <!-- Tester: check -->
    <path d="M178 190 L187 199 L203 181"/>
    <!-- Security: shield -->
    <path d="M66 176 L78 181 L78 190 Q78 201 66 206 Q54 201 54 190 L54 181 Z"/>
  </g>

  <!-- retro: a small moon on the orbit -->
  <circle cx="128" cy="40" r="7" fill="#ffffff" filter="url(#glow)"/>

  <!-- the conductor: a hexagon core with an H -->
  <g filter="url(#glow)">
    <path d="M128 94 L157.4 111 L157.4 145 L128 162 L98.6 145 L98.6 111 Z"
          fill="url(#core)" stroke="#e4dcff" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <g fill="#ffffff">
    <rect x="112" y="112" width="8" height="32" rx="3"/>
    <rect x="136" y="112" width="8" height="32" rx="3"/>
    <rect x="112" y="124" width="32" height="8" rx="3"/>
  </g>
</svg>
