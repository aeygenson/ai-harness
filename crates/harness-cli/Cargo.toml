[package]
name = "harness-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "harness"
path = "src/main.rs"

[dependencies]
harness-core = { path = "../harness-core" }
harness-agents = { path = "../harness-agents" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
harness-tui = { path = "../harness-tui" }

[dev-dependencies]
tempfile = "3"
