[package]
name = "harness-agents"
version = "0.3.0"
edition = "2021"

[dependencies]
harness-platform = { path = "../harness-platform" }
harness-core = { path = "../harness-core" }
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SHA-256 for the PKCE challenge of the MCP sign-in (mcp/oauth/encoding.rs).
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["macros", "process", "time", "io-util"] }

[dev-dependencies]
harness-fake = { path = "../harness-fake" }
tokio = { version = "1", features = ["macros", "rt", "process", "time", "io-util"] }

[lints]
workspace = true
