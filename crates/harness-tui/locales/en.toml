# The texts of `harness tui` in English, the default language.
#
# To add a language, copy this file to ~/.harness/locales/<code>.toml
# (for example de.toml), translate the texts and restart the TUI: the language
# button in the top right corner then offers it too. A text missing from a
# translation is shown in English. {name} marks a value filled in by the TUI.
# A file there with the code of a built-in language (en, ru) replaces its texts.

# Shown on the language button.
language = "EN"

