[package]
name = "harness-tui"
version = "0.2.0"
edition = "2021"

[dependencies]
harness-platform = { path = "../harness-platform" }
harness-core = { path = "../harness-core" }
harness-agents = { path = "../harness-agents" }
anyhow = "1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["rt", "time", "process", "io-util", "sync", "macros"] }

[dev-dependencies]
tempfile = "3"
