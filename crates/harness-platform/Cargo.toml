[package]
name = "harness-platform"
version = "0.7.0"
edition = "2021"

# Only for catching the stop signals (see `stop`): the rest of the harness
# already runs on tokio, so this adds no new crate.
[dependencies]
tokio = { version = "1", features = ["signal", "macros", "rt"] }

# Only for noticing a closed terminal (see `input`) without `unsafe`: its safe
# `poll`; and, on Linux, for stopping a process through a pidfd (see
# `run_mark`). crossterm already brings this crate in, so it adds nothing new.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["event", "process"] }

# Only for reading a secret on Windows, which has no `stty`.
[target.'cfg(windows)'.dependencies]
crossterm = "0.29"

[dev-dependencies]
harness-fake = { path = "../harness-fake" }
tempfile = "3"
tokio = { version = "1", features = ["signal", "macros", "rt", "time"] }

# Tests make a pseudo-terminal, the real thing a closed window hangs up.
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1", features = ["event", "process", "pty"] }

[lints]
workspace = true
