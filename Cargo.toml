[workspace]
resolver = "2"
members = ["crates/harness-platform", "crates/harness-core", "crates/harness-agents", "crates/harness-cli", "crates/harness-tui"]

# Lints shared by every crate (each crate's Cargo.toml says `[lints] workspace = true`).
[workspace.lints.rust]
# Every public item needs a `///` comment (AGENTS.md, "Documentation").
missing_docs = "warn"
