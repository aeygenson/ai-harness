[workspace]
resolver = "2"
members = ["crates/harness-fake", "crates/harness-platform", "crates/harness-core", "crates/harness-agents", "crates/harness-cli", "crates/harness-tui"]

# Lints shared by every crate (each crate's Cargo.toml says `[lints] workspace = true`).
[workspace.lints.rust]
# Every public item needs a `///` comment (AGENTS.md, "Documentation").
missing_docs = "warn"
# The compiler lints recommended by M-STATIC-VERIFICATION (docs/rust-guidelines.md).
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
# The stricter `pedantic` group (M-STATIC-VERIFICATION). `priority = -1` lets the single
# lints below override the group.
pedantic = { level = "warn", priority = -1 }
# Turned off on purpose (audit, section 7.4): noise for a program, not a library.
must_use_candidate = "allow"
return_self_not_must_use = "allow"
# AGENTS.md asks for `# Errors` sections only on complex functions.
missing_errors_doc = "allow"

# Lints from the `restriction` group recommended by M-STATIC-VERIFICATION: each one
# forbids a construct that hides a mistake or makes code harder to read.
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
